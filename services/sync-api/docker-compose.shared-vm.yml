# Shared VM (95.135.254.46): run alongside other apps (no Caddy of our own).
# Host nginx owns :80/:443 and proxies api.yatharthafoods.in → 127.0.0.1:3001.
#
# Usage:
#   docker compose -p yatharth-sync -f docker-compose.yml -f docker-compose.shared-vm.yml up -d --build

services:
  postgres:
    container_name: yatharth-sync-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yatharth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-yatharth_sync}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yatharth} -d ${POSTGRES_DB:-yatharth_sync}",
        ]

  api:
    container_name: yatharth-sync-api
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yatharth}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yatharth_sync}
      PORT: "3001"
      HOST: 0.0.0.0
      SYNC_SECRET: ${SYNC_SECRET:?Set SYNC_SECRET in .env}
      WEBSITE_ORIGIN: ${WEBSITE_ORIGIN:-https://yatharthafoods.in}
      UPLOAD_DIR: /data/uploads
      VERCEL_REVALIDATE_URL: ${VERCEL_REVALIDATE_URL:-https://www.yatharthafoods.in/api/revalidate}
      REVALIDATE_WEBHOOK_SECRET: ${REVALIDATE_WEBHOOK_SECRET:?Set REVALIDATE_WEBHOOK_SECRET in .env}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-}
      CONTACT_NOTIFY_FROM: ${CONTACT_NOTIFY_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
